<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <g id="spoke">
      <line x1="50" y1="50" x2="50" y2="15" stroke="#E5B235" stroke-width="6"/>
      <circle cx="50" cy="11" r="4.5" fill="#E5B235"/>
    </g>
    <mask id="hub-mask">
      <rect width="100" height="100" fill="white"/>
      <circle cx="50" cy="50" r="5" fill="black"/>
    </mask>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#E5B235" stroke-width="7"/>
  
  <!-- 8 Spokes and Knobs -->
  <use href="#spoke" />
  <use href="#spoke" transform="rotate(45 50 50)" />
  <use href="#spoke" transform="rotate(90 50 50)" />
  <use href="#spoke" transform="rotate(135 50 50)" />
  <use href="#spoke" transform="rotate(180 50 50)" />
  <use href="#spoke" transform="rotate(225 50 50)" />
  <use href="#spoke" transform="rotate(270 50 50)" />
  <use href="#spoke" transform="rotate(315 50 50)" />

  <!-- Inner Hub -->
  <circle cx="50" cy="50" r="14" fill="#E5B235" mask="url(#hub-mask)"/>
</svg>